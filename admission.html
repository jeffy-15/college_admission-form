<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSR College Admission Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ==== GENERAL ==== */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==== NAVBAR ==== */
        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
        }

        .nav-link {
            color: #f8f9fa !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #ffc107 !important;
        }

        /* ==== HERO ==== */
        .hero {
            color: white;
            text-align: center;
            padding: 140px 20px 100px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.2rem;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* ==== FORM CONTAINER ==== */
        .form-section {
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            margin: -60px auto 60px;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease-in-out;
        }

        .form-section:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            font-weight: 500;
        }

        .form-control,
        .form-select,
        textarea {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            border-radius: 8px;
            transition: 0.3s;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: none;
            border: 1px solid #ffc107;
            color: #fff;
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        select option {
            color: #000;
        }

        /* ==== BUTTON ==== */
        .btn-primary {
            background: linear-gradient(90deg, #ff9800, #ffc107);
            border: none;
            color: #212121;
            font-weight: 600;
            padding: 10px 40px;
            border-radius: 30px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #ffc107, #ff9800);
            transform: translateY(-3px);
        }

        /* ==== FOOTER ==== */
        footer {
            text-align: center;
            color: #f8f9fa;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 15px;
        }

        /* ==== RESPONSIVE ==== */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.3rem;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">IPSR College</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Admission</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container">
            <h1>College Admission 2025</h1>
            <p>Shape your future with IPSR College. Apply now and join a legacy of excellence.</p>
            <a href="#admissionForm" class="btn btn-primary mt-4">Start Application</a>
        </div>
    </section>

    <!-- ADMISSION FORM -->
    <section id="admissionForm" class="form-section">
        <h2 class="text-center mb-4 text-warning">Admission Form</h2>

        <form id="collegeForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="Enter your phone number" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Course Applying For</label>
                    <select class="form-select" required>
                        <option value="">Select Course</option>
                        <option>B.Sc Computer Science</option>
                        <option>B.Com</option>
                        <option>B.A English</option>
                        <option>B.Tech</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <select class="form-select" required>
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" rows="3" placeholder="Enter your address" required></textarea>
                </div>
                <div class="col-12 text-center mt-4">
                    <button type="submit" class="btn btn-primary px-5">Submit Application</button>
                </div>
            </div>
        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 IPSR College | Designed with ❤️ by the Web Team</p>
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FORM JS -->
    <script>
        document.getElementById('collegeForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('🎉 Your application has been successfully submitted!');
            this.reset();
        });
    </script>
</body>

</html>
